name: Sync Nuvio releases

# For the TEST repo. Merges a Nuvio release into this repo and stops there: no build and no
# release, so nothing here is ever published. Run it from the Actions tab (Run workflow), then
# upload the matching nuvio-livetv-kit.zip and run Build Test APK.
#
# Where Nuvio and Live TV changed the same lines, Live TV's side is kept for now; the kit you
# upload next replaces those files with the properly combined versions.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Nuvio release to merge, e.g. 1.1.0-beta.8 (leave empty for the newest)"
        required: false
        type: string

permissions:
  contents: write

env:
  UPSTREAM: NuvioMedia/NuvioTV

concurrency:
  group: sync-nuvio-releases
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge the Nuvio release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/$UPSTREAM/releases?per_page=10" --jq '[.[] | select(.draft == false)][0].tag_name')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Could not read Nuvio's releases." >&2
            exit 1
          fi
          echo "Nuvio release: $TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          # A private ref, so Nuvio's tag names don't clash with this repo's.
          git fetch --no-tags upstream "+refs/tags/$TAG:refs/remotes/upstream/release"

          if git merge-base --is-ancestor refs/remotes/upstream/release HEAD; then
            echo "Nuvio $TAG is already merged. Nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git merge --no-edit -X ours -m "Merge Nuvio $TAG" refs/remotes/upstream/release
          git push
          {
            echo "Merged Nuvio $TAG (no build, no release)."
            echo "Next: upload the matching nuvio-livetv-kit.zip, then run Build Test APK."
          } >> "$GITHUB_STEP_SUMMARY"
